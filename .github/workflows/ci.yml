name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  npm-quality:
    name: npm quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

  npm-package-smoke:
    name: npm package smoke and pack (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm package dry run
        run: npm run pack:check

      - name: Create npm package tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --workspace planview --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          tarball="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const packages = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (packages.length !== 1 || !packages[0].filename) {
              throw new Error("npm pack did not produce exactly one tarball");
            }
            console.log(packages[0].filename);
          ' "$RUNNER_TEMP/pack.json")"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke test packed npm package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/planview-smoke"
          npm install --global --prefix "$install_dir" --ignore-scripts "$TARBALL"
          "$install_dir/bin/planview" --help
          "$install_dir/bin/planview" --version
          home_dir="$RUNNER_TEMP/planview-skill-home"
          test ! -e "$home_dir"
          HOME="$home_dir" USERPROFILE="$home_dir" "$install_dir/bin/planview" skills install
          test -f "$home_dir/.agents/skills/planview/SKILL.md"
          test -f "$home_dir/.agents/skills/create-html/SKILL.md"
          test -f "$home_dir/.agents/skills/create-html/references/browser-native-patterns.md"
